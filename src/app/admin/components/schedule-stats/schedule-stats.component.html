<div class="stats-page">
  <div class="stats-page-header">
    <h1>סטטיסטיקות עובדים</h1>
    <button (click)="clearAll()" class="btn-clear-stats" title="נקה את כל הגשות העובדים">
      נקה הגשות
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-hint">טוען...</div>

  <table class="stats-table" *ngIf="!isLoading">
    <thead>
      <tr>
        <th class="text-start">עובד</th>
        <th>הגיש</th>
        <th>קיבל</th>
        <th>לילה</th>
        <th>פעולות</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let stat of employeeStats">
        <td class="text-start emp-name">
          <div class="emp-name-text" title="לחץ לעריכת שם" (click)="editName(stat)">{{ stat.name }}</div>
          <span class="notes-indicator" *ngIf="stat.notes" [title]="stat.notes">📝</span>
        </td>
        <td class="num-requested">{{ stat.requested }}</td>
        <td class="num-total">{{ stat.total }}</td>
        <td class="num-night">{{ stat.night }}</td>
        <td>
          <button class="icon-btn" title="ערוך הגשה" (click)="openEditModal(stat)">📋 ערוך הגשה</button>
        </td>
      </tr>
      <tr *ngIf="employeeStats.length === 0">
        <td colspan="5" class="empty-state">עדיין אין הגשות זמינות</td>
      </tr>
    </tbody>
  </table>

  <!-- מודאל עריכת הגשה -->
  <div class="modal-backdrop" *ngIf="showEditAvailabilityModal" (click)="closeEditModal()"></div>
  <div class="assignment-modal edit-availability-modal" *ngIf="showEditAvailabilityModal">
    <h2 class="modal-title">עריכת הגשה — {{ editingEmployeeName }}</h2>
    <div class="edit-modal-body" *ngIf="!isLoadingEdit; else loadingTpl">
      <div class="edit-shifts-table">
        <div class="edit-row header-row">
          <div class="edit-row-label"></div>
          <div class="edit-day-col" *ngFor="let day of daysOfWeek">{{ day }}</div>
        </div>
        <div class="edit-row" *ngFor="let shiftLabel of editShiftLabels">
          <div class="edit-row-label">{{ shiftLabel }}</div>
          <div class="edit-day-col" *ngFor="let day of daysOfWeek">
            <button class="toggle-icon" [class.is-on]="isEditSelected(day, shiftLabel)" (click)="toggleEditPreference(day, shiftLabel)">
              {{ isEditSelected(day, shiftLabel) ? '✓' : '⊘' }}
            </button>
          </div>
        </div>
      </div>
      <label class="edit-notes-label" for="editNotes">הערות</label>
      <textarea id="editNotes" class="edit-notes-input" rows="2" [(ngModel)]="editNotes"></textarea>
      <div class="edit-modal-actions">
        <button class="btn-cancel-edit" (click)="closeEditModal()">ביטול</button>
        <button class="btn-save-edit" (click)="saveEditedAvailability()">שמור שינויים</button>
      </div>
    </div>
    <ng-template #loadingTpl>
      <p class="edit-loading">טוען הגשה...</p>
    </ng-template>
  </div>
</div>
