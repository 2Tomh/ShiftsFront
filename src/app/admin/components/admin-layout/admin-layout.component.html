<div class="admin-layout" [class.sidenav-closed]="!isSidenavOpen">

  <!-- כפתור המבורגר צף: מוצג רק במסכים צרים, כשהתפריט סגור
       ומוסתר לגמרי מחוץ למסך. -->
  <button
    type="button"
    class="btn-mobile-toggle"
    *ngIf="!isSidenavOpen"
    (click)="toggleSidenav()"
    title="פתח תפריט">
    ☰
  </button>

  <!-- שכבת רקע שקופה-חצי: מוצגת רק במסכים צרים כשהתפריט פתוח,
       כדי לאפשר סגירה בלחיצה מחוץ לתפריט. -->
  <div class="sidenav-backdrop" *ngIf="isSidenavOpen" (click)="toggleSidenav()"></div>

  <!-- תפריט הצד -->
  <aside class="admin-sidenav">
    <div class="sidenav-header">
      <span class="sidenav-brand" *ngIf="isSidenavOpen">ניהול · HP נס ציונה</span>
      <button class="btn-toggle-sidenav" (click)="toggleSidenav()" [title]="isSidenavOpen ? 'סגור תפריט' : 'פתח תפריט'">
        {{ isSidenavOpen ? '‹' : '›' }}
      </button>
    </div>

    <!-- חדש - (click)="onNavLinkClick()" על כל קישור: במובייל, בחירת
         לשונית סוגרת אוטומטית את התפריט (שפתוח כמגירה מעל התוכן),
         כדי שמיד רואים את העמוד החדש שנטען במקום שהתפריט יישאר
         פתוח מעליו. בדסקטופ זה לא משנה כלום (הפונקציה בודקת רוחב
         מסך בעצמה ולא עושה שום דבר שם). -->
    <nav class="sidenav-nav">
      <a routerLink="/admin/board" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">לוח מנהל</span>
      </a>
      <a routerLink="/admin/vacations" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">אישור חופשות</span>
      </a>
      <a routerLink="/admin/sick-leaves" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">אישור מחלה</span>
      </a>
      <a routerLink="/admin/weapon" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">מעקב נשק</span>
      </a>
      <a routerLink="/admin/board-settings" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">הגדרות לוח</span>
      </a>
      <!-- מאוחד: ניהול עובדים כולל עכשיו גם ניהול משתמשים/גישה
           (עמודת "גישה למערכת" בטבלה) - אין יותר צורך בקישור נפרד -->
      <a routerLink="/admin/employee-management" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">ניהול עובדים</span>
      </a>
      <a routerLink="/admin/stats" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">סטטיסטיקות</span>
      </a>
      <!-- דוח אישי לעובד: הגשות זמינות + משמרות בפועל + בקשות
           חופשה/מחלה, לפי עובד וטווח תאריכים -->
      <a routerLink="/admin/personal-report" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">דוח אישי</span>
      </a>
      <!-- חדש - הוחזר: ה-route קיים עכשיו ב-admin-routing.module.ts -->
      <a routerLink="/admin/manager-settings" routerLinkActive="active" class="nav-link" (click)="onNavLinkClick()">
        <span class="nav-text">פרטי מנהל</span>
      </a>
    </nav>

    <div class="sidenav-footer">
      <div class="sidenav-user" *ngIf="username && isSidenavOpen">
        <span class="user-name">{{ username }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">
        <span class="nav-text">התנתק</span>
      </button>
    </div>
  </aside>

  <!-- אזור התוכן המרכזי -->
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
