<div class="schedule-page">

  <!-- כותרת ראשית (קומפוננטה) -->
  <app-schedule-header
    [isPublishing]="isPublishing"
    [shiftsLength]="shifts.length"
    [isWeekPublished]="isWeekPublished"
    (generateWeekEvent)="generateWeek()"
    (publishWeekEvent)="publishWeek()">
  </app-schedule-header>

  <div class="main-layout">
    
    <!-- מיכל הטבלה המרכזית -->
    <div class="table-container">
      <div class="table-scroll">
        <table class="schedule-table matrix-table">
          <thead>
            <tr>
              <th class="col-side-label">משמרת</th>
              <th class="col-role-label">תפקיד</th>
              <th *ngFor="let day of daysOfWeek" colspan="2">{{ day }}</th>
            </tr>
          </thead>
          <tbody>

            <!-- ================= סקשיין בוקר ================= -->
            <ng-container *ngFor="let role of morningRoles; let firstRole = first">
              <tr class="shift-morning">
                <td *ngIf="firstRole" [attr.rowspan]="4" class="shift-label-vertical">
                  <span class="shift-icon">☀️</span>
                  בוקר
                </td>
                <td class="role-sidebar">{{ role }}</td>
                <ng-container *ngFor="let day of daysOfWeek; let i = index">
                  <td class="bank-cell" [attr.rowspan]="4" *ngIf="firstRole">
                    <div class="side-mini-title">הגישו</div>
                    <button
                      *ngFor="let c of getCandidatesForCell(i, shiftTypes[0].type)"
                      class="candidate-line"
                      [class.is-assigned]="isCandidateAssignedToAny(i, shiftTypes[0].type, c.fullName, morningRoles)"
                      (click)="assignFromSharedBank(i, shiftTypes[0].type, c, morningRoles)"
                      [title]="c.fullName">
                      {{ c.fullName }}
                    </button>
                    <span class="no-candidates" *ngIf="getCandidatesForCell(i, shiftTypes[0].type).length === 0">—</span>
                  </td>
                  <td class="assign-cell hatched-cell" *ngIf="role === 'מאבטח' && i >= 5"></td>
                  <td class="assign-cell" [class.is-selecting]="isSelectingRole(i, shiftTypes[0].type, role)" *ngIf="!(role === 'מאבטח' && i >= 5)">
                    <div class="side-mini-title">{{ role }}</div>
                    <div class="assigned-display-box" *ngIf="getEmployeeForRole(i, shiftTypes[0].type, role) as assignedName; else emptySlot0">
                      <span class="assigned-name-text">{{ assignedName }}</span>
                      <button class="btn-remove-mini" (click)="removeEmployee(i, shiftTypes[0].type, role)" title="הסר שיבוץ">×</button>
                    </div>
                    <ng-template #emptySlot0>
                      <button class="btn-add-mini" (click)="startSelectingRole(i, shiftTypes[0].type, role)" title="בחר מהבנק">+</button>
                    </ng-template>
                  </td>
                </ng-container>
              </tr>
            </ng-container>

            <!-- ================= סקשיין צהריים ================= -->
            <ng-container *ngFor="let role of mainRoles; let firstRole = first">
              <tr class="shift-afternoon">
                <td *ngIf="firstRole" [attr.rowspan]="3" class="shift-label-vertical">
                  <span class="shift-icon">🌤️</span>
                  צהריים
                </td>
                <td class="role-sidebar">{{ role }}</td>
                <ng-container *ngFor="let day of daysOfWeek; let i = index">
                  <td class="bank-cell" [attr.rowspan]="3" *ngIf="firstRole">
                    <div class="side-mini-title">הגישו</div>
                    <button
                      *ngFor="let c of getCandidatesForCell(i, shiftTypes[1].type)"
                      class="candidate-line"
                      [class.is-assigned]="isCandidateAssignedToAny(i, shiftTypes[1].type, c.fullName, mainRoles)"
                      (click)="assignFromSharedBank(i, shiftTypes[1].type, c, mainRoles)"
                      [title]="c.fullName">
                      {{ c.fullName }}
                    </button>
                    <span class="no-candidates" *ngIf="getCandidatesForCell(i, shiftTypes[1].type).length === 0">—</span>
                  </td>
                  <td class="assign-cell" [class.is-selecting]="isSelectingRole(i, shiftTypes[1].type, role)">
                    <div class="side-mini-title">{{ role }}</div>
                    <div class="assigned-display-box" *ngIf="getEmployeeForRole(i, shiftTypes[1].type, role) as assignedName; else emptySlot2">
                      <span class="assigned-name-text">{{ assignedName }}</span>
                      <button class="btn-remove-mini" (click)="removeEmployee(i, shiftTypes[1].type, role)" title="הסר שיבוץ">×</button>
                    </div>
                    <ng-template #emptySlot2>
                      <button class="btn-add-mini" (click)="startSelectingRole(i, shiftTypes[1].type, role)" title="בחר מהבנק">+</button>
                    </ng-template>
                  </td>
                </ng-container>
              </tr>
            </ng-container>

            <!-- ================= סקשיין לילה ================= -->
            <ng-container *ngFor="let role of mainRoles; let firstRole = first">
              <tr class="shift-night">
                <td *ngIf="firstRole" [attr.rowspan]="3" class="shift-label-vertical">
                  <span class="shift-icon">🌙</span>
                  לילה
                </td>
                <td class="role-sidebar">{{ role }}</td>
                <ng-container *ngFor="let day of daysOfWeek; let i = index">
                  <td class="bank-cell" [attr.rowspan]="3" *ngIf="firstRole">
                    <div class="side-mini-title">הגישו</div>
                    <button
                      *ngFor="let c of getCandidatesForCell(i, shiftTypes[2].type)"
                      class="candidate-line"
                      [class.is-assigned]="isCandidateAssignedToAny(i, shiftTypes[2].type, c.fullName, mainRoles)"
                      (click)="assignFromSharedBank(i, shiftTypes[2].type, c, mainRoles)"
                      [title]="c.fullName">
                      {{ c.fullName }}
                    </button>
                    <span class="no-candidates" *ngIf="getCandidatesForCell(i, shiftTypes[2].type).length === 0">—</span>
                  </td>
                  <td class="assign-cell" [class.is-selecting]="isSelectingRole(i, shiftTypes[2].type, role)">
                    <div class="side-mini-title">{{ role }}</div>
                    <div class="assigned-display-box" *ngIf="getEmployeeForRole(i, shiftTypes[2].type, role) as assignedName; else emptySlot3">
                      <span class="assigned-name-text">{{ assignedName }}</span>
                      <button class="btn-remove-mini" (click)="removeEmployee(i, shiftTypes[2].type, role)" title="הסר שיבוץ">×</button>
                    </div>
                    <ng-template #emptySlot3>
                      <button class="btn-add-mini" (click)="startSelectingRole(i, shiftTypes[2].type, role)" title="בחר מהבנק">+</button>
                    </ng-template>
                  </td>
                </ng-container>
              </tr>
            </ng-container>

          </tbody>
        </table>
      </div>
    </div>

    <!-- פאנל סטטיסטיקות (קומפוננטה) -->
    <app-schedule-stats
      [employeeStats]="employeeStats"
      (clearStatsEvent)="clearAllAvailabilities()"
      (editNameEvent)="editEmployeeName($event)"
      (openEditModalEvent)="openEditAvailabilityModal($event)">
    </app-schedule-stats>

  </div>

  <!-- מודאל עריכת הגשה -->
  <div class="modal-backdrop" *ngIf="showEditAvailabilityModal" (click)="closeEditAvailabilityModal()"></div>
  <div class="assignment-modal edit-availability-modal" *ngIf="showEditAvailabilityModal">
    <h2 class="modal-title">עריכת הגשה — {{ editingEmployeeName }}</h2>
    <div class="edit-modal-body" *ngIf="!isLoadingEdit; else loadingTpl">
      <div class="edit-shifts-table">
        <div class="edit-row header-row">
          <div class="edit-row-label"></div>
          <div class="edit-day-col" *ngFor="let day of daysOfWeek">{{ day }}</div>
        </div>
        <div class="edit-row" *ngFor="let shiftLabel of editShiftLabels">
          <div class="edit-row-label">{{ shiftLabel }}</div>
          <div class="edit-day-col" *ngFor="let day of daysOfWeek">
            <button class="toggle-icon" [class.is-on]="isEditSelected(day, shiftLabel)" (click)="toggleEditPreference(day, shiftLabel)">
              {{ isEditSelected(day, shiftLabel) ? '✓' : '⊘' }}
            </button>
          </div>
        </div>
      </div>
      <label class="edit-notes-label" for="editNotes">הערות</label>
      <textarea id="editNotes" class="edit-notes-input" rows="2" [(ngModel)]="editNotes"></textarea>
      <div class="edit-modal-actions">
        <button class="btn-cancel-edit" (click)="closeEditAvailabilityModal()">ביטול</button>
        <button class="btn-save-edit" (click)="saveEditedAvailability()">שמור שינויים</button>
      </div>
    </div>
    <ng-template #loadingTpl>
      <p class="edit-loading">טוען הגשה...</p>
    </ng-template>
  </div>

</div>
