<header class="page-header">
  <div class="header-actions">
    <button class="btn-create-week" (click)="onGenerateWeek()">
      <span class="btn-icon">+</span> צור שבוע חדש
    </button>
    <button class="btn-publish" (click)="onPublishWeek()" [disabled]="isPublishing || shiftsLength === 0">
      {{ isPublishing ? 'מפרסם...' : '📢 פרסום ללוח העובדים' }}
    </button>
    <span class="publish-status" [class.is-published]="isWeekPublished">
      {{ isWeekPublished ? '✓ פורסם' : 'טיוטה - לא פורסם' }}
    </span>
  </div>
  <h1 class="page-title">לוח משמרות שבועי</h1>
  <p class="eyebrow">HP נס ציונה</p>
</header>
