<p>employee-management works!</p>
<div class="admin-container">
  <div class="admin-header-row">
    <h3>ניהול עובדים</h3>
    <div class="header-buttons">
      <button class="btn-secondary" (click)="showAddColumn = !showAddColumn">+ הוסף עמודה</button>
      <button class="btn-add-employee" (click)="addEmployee()">+ הוסף עובד</button>
    </div>
  </div>

  <div class="add-column-row" *ngIf="showAddColumn">
    <input
      type="text"
      [(ngModel)]="newColumnName"
      placeholder="כותרת העמודה החדשה (לדוגמה: מספר טלפון)"
      (keyup.enter)="addColumn()">
    <button (click)="addColumn()">הוסף</button>
  </div>

  <div *ngIf="isLoading" class="loading-hint">טוען...</div>

  <div class="table-scroll" *ngIf="!isLoading">
    <table class="admin-table">
      <thead>
        <tr>
          <th>שם מלא</th>
          <th>כתובת מייל</th>
          <th>תאריך העסקה</th>
          <th>חמוש</th>
          <th *ngFor="let col of config.customColumns">
            {{ col }}
            <button class="btn-remove-col" title="הסר עמודה" (click)="removeColumn(col)">×</button>
          </th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let profile of profiles">
          <td><input type="text" [(ngModel)]="profile.fullName" placeholder="שם מלא"></td>
          <td><input type="email" [(ngModel)]="profile.email" placeholder="email@example.com"></td>
          <td><input type="date" [(ngModel)]="profile.hireDate"></td>
          <td class="armed-cell">
            <input type="checkbox" [(ngModel)]="profile.isArmed">
            <span>{{ profile.isArmed ? 'חמוש' : 'לא חמוש' }}</span>
          </td>
          <td *ngFor="let col of config.customColumns">
            <input type="text" [(ngModel)]="profile.customFieldValues[col]">
          </td>
          <td class="actions-cell">
            <button (click)="save(profile)">שמור</button>
            <button class="btn-remove" (click)="deleteProfile(profile)">מחק</button>
          </td>
        </tr>
        <tr *ngIf="profiles.length === 0">
          <td [attr.colspan]="5 + config.customColumns.length" class="empty-state">
            עדיין לא נוספו עובדים. לחצי "+ הוסף עובד" כדי להתחיל.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
