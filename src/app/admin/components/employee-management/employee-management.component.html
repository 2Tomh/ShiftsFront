<div class="admin-container">
  <div class="admin-header-row">
    <h3>ניהול עובדים</h3>
    <div class="header-buttons">
      <button class="btn-secondary" (click)="showAddColumn = !showAddColumn">+ הוסף עמודה</button>
      <button class="btn-secondary btn-cleanup" (click)="cleanupEmptyRows()">🧹 נקה שורות ריקות</button>
      <button class="btn-add-employee" (click)="addEmployee()">+ הוסף עובד</button>
    </div>
  </div>

  <div class="add-column-row" *ngIf="showAddColumn">
    <input
      type="text"
      [(ngModel)]="newColumnName"
      placeholder="כותרת העמודה החדשה (לדוגמה: מספר טלפון)"
      (keyup.enter)="addColumn()">
    <button (click)="addColumn()">הוסף</button>
  </div>

  <div *ngIf="isLoading" class="loading-hint">טוען...</div>

  <div class="table-scroll" *ngIf="!isLoading">
    <table class="admin-table">
      <thead>
        <tr>
          <th>שם מלא</th>
          <th>כתובת מייל</th>
          <th>תאריך העסקה</th>
          <th>חמוש</th>
          <th *ngFor="let col of config.customColumns">
            {{ col }}
            <button class="btn-remove-col" title="הסר עמודה" (click)="removeColumn(col)">×</button>
          </th>
          <th>שם משתמש</th>
          <th>סיסמה</th>
          <th>הרשאה</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td class="col-name"><input type="text" [(ngModel)]="row.fullName" placeholder="שם מלא"></td>
          <td class="col-email"><input type="email" [(ngModel)]="row.email" placeholder="email@example.com"></td>
          <td class="col-date"><input type="date" [(ngModel)]="row.hireDate"></td>
          <td>
            <select class="role-select" [(ngModel)]="row.armedStatus">
              <option value="NotArmed">לא חמוש</option>
              <option value="InProgress">בתהליך</option>
              <option value="Armed">חמוש</option>
            </select>
          </td>
          <td *ngFor="let col of config.customColumns">
            <input type="text" [(ngModel)]="row.customFieldValues[col]">
          </td>

          <td class="col-username">
            <input type="text" [(ngModel)]="row.username" placeholder="לדוגמה: dana.k">
          </td>
          <td class="col-password">
            <input type="text" [(ngModel)]="row.password"
              [placeholder]="row.username ? 'ריק = ללא שינוי' : 'לפחות 4 תווים'">
          </td>
          <td>
            <select class="role-select" [(ngModel)]="row.systemRole">
              <option [ngValue]="'Employee'">עובד</option>
              <option [ngValue]="'Admin'">מנהל</option>
            </select>
          </td>

          <td class="actions-cell">
            <button (click)="save(row)">שמור</button>
            <button class="btn-remove-small" *ngIf="row.username" (click)="removeAccess(row)">הסר גישה</button>
            <button class="btn-remove" (click)="deleteProfile(row)">מחק</button>
          </td>
        </tr>
        <tr *ngIf="rows.length === 0">
          <td [attr.colspan]="8 + config.customColumns.length" class="empty-state">
            עדיין לא נוספו עובדים. לחצי "+ הוסף עובד" כדי להתחיל.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
