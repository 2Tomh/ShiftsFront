<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">HP נס ציונה</div>
    <nav class="sidebar-nav">
      <a routerLink="/schedule" routerLinkActive="active" class="nav-link">לוח משמרות</a>
      <a routerLink="/register" routerLinkActive="active" class="nav-link">הרשמת עובדים</a>
      <a routerLink="/vacation" routerLinkActive="active" class="nav-link">בקשת חופשה</a>
      <a routerLink="/sick-leave" routerLinkActive="active" class="nav-link">ימי מחלה</a>
      <!-- חדש: קישור למעקב נשק -->
      <a routerLink="/weapon" routerLinkActive="active" class="nav-link">מעקב הוצאת נשק</a>
    </nav>

    <div class="sidebar-user">
      <span class="user-name" *ngIf="employeeName">{{ employeeName }}</span>
      <button class="btn-logout" (click)="logout()">התנתק</button>
    </div>
  </aside>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <div class="notification-overlay" *ngIf="currentNotification">
    <div class="notification-popup">
      <div class="notification-icon">🔔</div>
      <h3 class="notification-title">{{ currentNotification.title }}</h3>
      <p class="notification-body">{{ currentNotification.body }}</p>
      <button class="btn-dismiss" (click)="dismissCurrentNotification()">הבנתי, סגור</button>
      <span class="notification-counter" *ngIf="pendingNotifications.length > 1">
        עוד {{ pendingNotifications.length - 1 }} התראות ממתינות
      </span>
    </div>
  </div>

</div>
