<div class="schedule-view-page">

  <header class="page-header">
    <h1 class="page-title">לוח משמרות</h1>
    <p class="eyebrow" *ngIf="lastUpdated">עודכן: {{ lastUpdated | date:'HH:mm:ss' }}</p>
  </header>

  <div class="controls-row">
    <input
      type="text"
      class="highlight-input"
      [(ngModel)]="highlightName"
      placeholder="הקלד/י את שמך כדי להדגיש את המשמרות שלך (אופציונלי)">
    <button class="btn-refresh" (click)="refreshNow()" [disabled]="isLoading">
      {{ isLoading ? 'מרענן...' : '🔄 רענן' }}
    </button>
  </div>

  <div *ngIf="!isLoading && shifts.length === 0" class="empty-hint">
    עדיין לא פורסם לוח משמרות לשבוע הזה.
  </div>

  <div class="table-container" *ngIf="shifts.length > 0">
    <div class="table-scroll">
      <table class="schedule-table">
        <thead>
          <tr>
            <th class="col-shift-type">משמרת</th>
            <th class="col-role-type">תפקיד</th>
            <th *ngFor="let day of daysOfWeek">{{ day }}</th>
          </tr>
        </thead>
        <tbody>
          <tr class="row-general">
            <td class="shift-label-vertical">כללי</td>
            <td class="role-sidebar">מאבטח</td>
            <td *ngFor="let day of daysOfWeek; let i = index" class="shift-cell">
              <span *ngIf="i < 5" class="assigned-name"
                [class.is-empty]="!getGuardForDay(i)"
                [class.is-me]="getGuardForDay(i).trim() === highlightName.trim() && highlightName.trim()">
                {{ getGuardForDay(i) || 'לא שובץ' }}
              </span>
              <span *ngIf="i >= 5" class="assigned-name is-empty">—</span>
            </td>
          </tr>
          <ng-container *ngFor="let st of shiftTypes">
            <tr *ngFor="let role of roles; let firstRole = first" [ngClass]="st.cssClass">
              <td *ngIf="firstRole" [attr.rowspan]="3" class="shift-label-vertical">
                <span class="shift-icon">{{ st.icon }}</span>
                {{ st.label }}
              </td>
              <td class="role-sidebar">{{ role }}</td>
              <td *ngFor="let day of daysOfWeek" class="shift-cell">
                <span
                  class="assigned-name"
                  [class.is-empty]="!getEmployeeForRole(day, st.label, role)"
                  [class.is-me]="isMe(day, st.label, role)">
                  {{ getEmployeeForRole(day, st.label, role) || 'לא שובץ' }}
                </span>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>

</div>
