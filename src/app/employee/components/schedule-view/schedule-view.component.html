<div class="schedule-view-page">

  <header class="page-header">
    <h1 class="page-title">לוח המשמרות שלי</h1>
    <p class="eyebrow" *ngIf="lastUpdated">עודכן: {{ lastUpdated | date:'HH:mm:ss' }}</p>
  </header>

  <div class="controls-row">
    <input
      type="text"
      class="highlight-input"
      [(ngModel)]="highlightName"
      placeholder="הקלד/י את שמך כדי להדגיש את המשמרות שלך (אופציונלי)">
    <button class="btn-refresh" (click)="refreshNow()" [disabled]="isLoading">
      {{ isLoading ? 'מרענן...' : '🔄 רענן' }}
    </button>
  </div>

  <div *ngIf="!isLoading && shifts.length === 0" class="empty-hint">
    עדיין לא פורסם לוח משמרות לשבוע הזה.
  </div>

  <div class="table-container" *ngIf="shifts.length > 0">
    <div class="table-scroll">
      <table class="schedule-table">
        <thead>
          <tr>
            <th class="col-shift-type">משמרת</th>
            <th class="col-role-type">תפקיד</th>
            <th *ngFor="let day of daysOfWeek">{{ day }}</th>
          </tr>
        </thead>
        <tbody>

          <ng-container *ngFor="let block of shiftBlocks">
            <tr *ngFor="let role of block.roles; let firstRole = first" [ngClass]="block.cssClass">
              <td *ngIf="firstRole" [attr.rowspan]="block.roles.length" class="shift-label-vertical">
                <span class="shift-icon">{{ block.icon }}</span>
                {{ block.label }}
              </td>
              <td class="role-sidebar">{{ role }}</td>
              <td *ngFor="let day of daysOfWeek" class="shift-cell">
                <span
                  class="assigned-name"
                  [class.is-empty]="!getEmployeeForRole(day, block.type, role)"
                  [class.is-me]="isMe(day, block.type, role)">
                  {{ getEmployeeForRole(day, block.type, role) || 'לא שובץ' }}
                </span>
              </td>
            </tr>
          </ng-container>

          <tr class="extra-row" *ngFor="let rowName of extraRowNames">
            <td class="shift-label-vertical extra-row-label" colspan="2">{{ rowName }}</td>
            <td class="shift-cell extra-row-cell" *ngFor="let day of daysOfWeek">
              {{ getExtraRowText(rowName, day) || '—' }}
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

</div>
